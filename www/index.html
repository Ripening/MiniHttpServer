<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>myMuduo HTTP Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>myMuduo HTTP Server</h1>
        <p class="subtitle">自研 Reactor 网络库 + HTTP 协议栈</p>

        <div class="cards">
            <div class="card">
                <h2>网络层</h2>
                <p>epoll 事件循环 · 非阻塞 IO · 多线程 Reactor</p>
            </div>
            <div class="card">
                <h2>协议层</h2>
                <p>状态机解析 · 半包粘包 · Keep-Alive</p>
            </div>
            <div class="card">
                <h2>路由层</h2>
                <p>静态路由 · 动态路由 :id · 路径参数</p>
            </div>
            <div class="card">
                <h2>静态文件</h2>
                <p>sendfile 零拷贝 · Content-Type 映射</p>
            </div>
        </div>

        <div class="footer">
            <p>curl http://127.0.0.1:8000/users/123 试试动态路由</p>
        </div>
    </div>
</body>
</html>
